name: Verify live news connection
on:
  push:
    branches: [main]
    paths:
      - functions/api/trend-news.js
      - .github/workflows/verify-live-news.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Wait for deployment and verify the public news endpoint
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'JS'
          const pause = ms => new Promise(resolve => setTimeout(resolve, ms));
          let deployed = false;
          for (let i = 0; i < 24; i++) {
            const response = await fetch('https://api.github.com/repos/lsh451600-ui/studing/commits/' + process.env.COMMIT_SHA + '/check-runs', { headers: { Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: 'application/vnd.github+json' } });
            const checks = await response.json();
            deployed = checks.check_runs?.some(c => c.name === 'Cloudflare Pages' && c.conclusion === 'success');
            if (deployed) break;
            await pause(5000);
          }
          if (!deployed) throw new Error('Deployment was not confirmed');
          let fresh = false;
          for (let i = 0; i < 2; i++) {
            const response = await fetch('https://studing.pages.dev/api/trend-news?verify=' + process.env.COMMIT_SHA, { signal: AbortSignal.timeout(25000), cache: 'no-store' });
            const data = await response.json();
            console.log(JSON.stringify({ version: data.version, available: data.available, stale: data.stale, failureCode: data.failureCode, upstreamStatus: data.upstreamStatus, errorType: data.errorType, networkCode: data.networkCode, errorCategory: data.errorCategory, articles: data.articles?.length, requestedAt: data.requestedAt, checkedAt: data.checkedAt }));
            fresh = data.available === true && data.stale === false;
            if (fresh) break;
            await pause(3000);
          }
          if (!fresh) throw new Error('Production news lookup still returns stale data; inspect the safe diagnostics above');
          JS
