name: Update dining trend news
on:
  schedule:
    # 00:00 / 12:00 UTC = 09:00 / 21:00 Asia/Seoul. GitHub may queue runs.
    - cron: '0 0,12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_news.py
      - .github/workflows/update-dining-news.yml
permissions:
  contents: write
concurrency:
  group: dining-news-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install article URL decoder
        run: pip install googlenewsdecoder==0.1.7 'selectolax<1'
      - run: python -c 'from googlenewsdecoder import gnewsdecoder'
      - name: Load previously published articles to prevent repeats
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download live-news-feed --pattern news.json --output /tmp/previous-news.json --repo lsh451600-ui/studing
      - name: Collect Google News and update homepage
        env:
          PREVIOUS_NEWS_PATH: /tmp/previous-news.json
        run: python scripts/update_news.py
      - name: Commit updated articles
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html news.json src/news-snapshot.js
          if [ -d assets/news ]; then git add -A assets/news; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update dining trend articles from Google News'
          git push origin HEAD:main
