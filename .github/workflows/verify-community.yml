name: Verify visitor counter and community storage
on:
  push:
    branches: [main]
    paths:
      - functions/api/visitors.js
      - functions/api/board-posts.js
      - .github/workflows/verify-community.yml
permissions:
  contents: read
jobs:
  live-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify production storage without exposing visitor identifiers
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'JS'
          const pause = ms => new Promise(resolve => setTimeout(resolve, ms));
          let deployed = false;
          for (let i = 0; i < 24; i++) {
            const response = await fetch('https://api.github.com/repos/lsh451600-ui/studing/commits/' + process.env.COMMIT_SHA + '/check-runs', { headers: { Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: 'application/vnd.github+json' } });
            const checks = await response.json();
            deployed = checks.check_runs?.some(c => c.name === 'Cloudflare Pages' && c.conclusion === 'success');
            if (deployed) break;
            await pause(5000);
          }
          if (!deployed) throw new Error('Deployment not confirmed');
          await pause(20000);
          let cookie = '', available = true;
          for (let i = 0; i < 2; i++) {
            const response = await fetch('https://studing.pages.dev/api/visitors?verify=' + process.env.COMMIT_SHA, { method: 'POST', headers: { Origin: 'https://studing.pages.dev', Cookie: cookie }, signal: AbortSignal.timeout(20000) });
            const data = await response.json();
            console.log('visitors', JSON.stringify({ status: response.status, available: data.available, reason: data.reason, today: data.today, total: data.total }));
            available = available && response.ok && data.available;
            cookie = response.headers.getSetCookie().map(c => c.split(';')[0]).join('; ');
          }
          const board = await fetch('https://studing.pages.dev/api/board-posts?verify=' + process.env.COMMIT_SHA, { signal: AbortSignal.timeout(20000) });
          const data = await board.json();
          console.log('board', JSON.stringify({ status: board.status, reason: data.reason, posts: data.posts?.length }));
          if (!available || !board.ok) throw new Error('Storage is not ready; see safe diagnostics above');
          JS
