name: Refresh dining news and video
on:
  schedule:
    # 00:00 / 12:00 UTC = 09:00 / 21:00 Asia/Seoul
    - cron: '0 0,12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-live-news.yml
      - scripts/update_news.py
permissions:
  contents: write
concurrency:
  group: live-google-news-feed
  cancel-in-progress: false
jobs:
  publish-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install googlenewsdecoder==0.1.7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Refresh the shared homepage video cache
        run: |
          node --input-type=module <<'JS'
          for (let attempt = 0; attempt < 3; attempt++) {
            try {
              const response = await fetch('https://studing.pages.dev/api/trend-video?scheduled=1', {
                headers: { Accept: 'application/json', 'Cache-Control': 'no-cache' },
                signal: AbortSignal.timeout(45000), cache: 'no-store'
              });
              if (!response.ok) throw new Error('Video endpoint HTTP ' + response.status);
              const data = await response.json();
              if (!data.available || data.stale) throw new Error('Video refresh failed: ' + (data.reason || 'stale'));
              console.log('Video refreshed:', data.video.title, data.checkedAt);
              break;
            } catch (error) {
              if (attempt === 2) throw error;
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
          }
          JS
      - name: Load previously published articles to prevent repeats
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download live-news-feed --pattern news.json --output /tmp/previous-news.json --repo lsh451600-ui/studing
      - name: Collect source links and article metadata
        id: news
        if: ${{ !cancelled() }}
        env:
          PREVIOUS_NEWS_PATH: /tmp/previous-news.json
        run: python scripts/update_news.py
      - name: Publish the data without rebuilding the website
        if: ${{ !cancelled() && steps.news.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          repo = 'lsh451600-ui/studing'
          view = subprocess.run(['gh', 'release', 'view', 'live-news-feed', '--repo', repo, '--json', 'assets'], capture_output=True, text=True)
          if view.returncode:
              subprocess.run(['gh', 'release', 'create', 'live-news-feed', '--repo', repo, '--target', '${{ github.sha }}', '--title', 'Live dining news data', '--notes', 'Google news source links and metadata. Collection timestamp is included in news.json.', '--latest=false'], check=True)
              known = set()
          else:
              known = {a['name'] for a in json.loads(view.stdout)['assets']}
          data = json.loads(Path('news.json').read_text())
          print('News refreshed:', data['updated_at'], 'articles:', len(data['articles']), 'newest:', data['articles'][0]['title'], flush=True)
          Path('/tmp/live-feed').mkdir(exist_ok=True)
          Path('/tmp/live-feed/news.json').write_text(json.dumps(data, ensure_ascii=False))
          subprocess.run(['gh', 'release', 'upload', 'live-news-feed', '/tmp/live-feed/news.json', '--repo', repo, '--clobber'], check=True)
          PY
