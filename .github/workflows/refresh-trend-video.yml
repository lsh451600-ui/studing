name: Refresh latest dining trend video
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-trend-video.yml
permissions:
  contents: read
concurrency:
  group: dining-trend-video-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Allow the Pages deployment to finish
        if: github.event_name == 'push'
        run: sleep 90
      - name: Refresh the shared homepage video cache
        run: |
          node --input-type=module <<'JS'
          for (const sort of ['latest', 'popular']) {
          for (let attempt = 0; attempt < 3; attempt++) {
            try {
              const response = await fetch('https://studing.pages.dev/api/trend-video?scheduled=1&sort=' + sort, {
                headers: { Accept: 'application/json', 'Cache-Control': 'no-cache' },
                signal: AbortSignal.timeout(45000), cache: 'no-store'
              });
              if (!response.ok) throw new Error('Video endpoint HTTP ' + response.status);
              const data = await response.json();
              if (!data.available || data.stale) throw new Error('Video refresh failed: ' + (data.reason || 'stale'));
              console.log('Video refreshed:', data.video.title, data.checkedAt);
              break;
            } catch (error) {
              if (attempt === 2) throw error;
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
          }
          }
          JS
