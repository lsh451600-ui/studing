name: Check member authentication
on:
  push:
    branches: [main]
    paths:
      - 'functions/api/*.js'
      - 'src/member-auth.js'
      - 'src/account-auth.js'
      - 'src/community.js'
      - 'tests/community.test.js'
      - 'tests/board-ui.cjs'
      - 'assets/js/board.js'
      - 'assets/css/board.css'
      - 'src/social-auth.js'
      - 'tests/social-auth.test.js'
      - 'tests/kakao-auth.test.js'
      - 'tests/login-ui.cjs'
      - 'assets/js/visitors.js'
      - 'tests/visitors.test.js'
      - 'assets/js/login.js'
      - 'assets/js/site-menu.js'
      - 'assets/js/recipes.js'
      - 'assets/css/recipe-board.css'
      - 'tests/recipe-board-ui.cjs'
      - 'tests/recipe-access.test.js'
      - 'src/recipe-server.js'
      - 'src/private-server.js'
      - 'assets/js/private.js'
      - 'tests/private.test.js'
      - 'tests/private-board-ui.cjs'
      - 'assets/js/trend-video.js'
      - 'assets/js/trend-news.js'
      - 'tests/visit-news.test.js'
      - 'src/news-snapshot.js'
      - 'assets/css/page-layout.css'
      - 'tests/trend-video.test.js'
      - 'assets/css/signup.css'
      - '*.html'
      - 'guides/*.html'
      - 'assets/css/journal.css'
      - 'assets/js/guide-tools.js'
      - 'scripts/publish_weekly_guide.py'
      - 'tests/test_weekly_guide.py'
      - '.github/workflows/publish-weekly-guide.yml'
      - 'tests/journal.test.js'
      - 'tests/journal-ui.cjs'
      - 'tests/google-ui.cjs'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'feed.xml'
      - 'scripts/build_feed.py'
      - 'tests/seo.test.js'
      - 'functions/_middleware.js'
      - '_routes.json'
      - '_headers'
      - 'assets/*.webp'
      - 'favicon.ico'
      - 'tests/signup.test.js'
      - 'tests/account.test.js'
      - 'tests/account-ui.cjs'
      - 'assets/js/account.js'
      - 'assets/js/password-recovery.js'
      - 'assets/css/account.css'
      - '.github/workflows/check-member-auth.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_weekly_guide.py'
      - run: node --test tests/seo.test.js tests/journal.test.js tests/account.test.js tests/private.test.js tests/community.test.js tests/visit-news.test.js tests/recipe-access.test.js tests/signup.test.js tests/social-auth.test.js tests/kakao-auth.test.js tests/trend-video.test.js tests/visitors.test.js
      - run: python tests/test_update_news.py

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser test tools
        run: |
          npm install --prefix /tmp/login-browser-check --no-save playwright
          /tmp/login-browser-check/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify login layout and account controls in Chromium
        run: |
          NODE_PATH=/tmp/login-browser-check/node_modules node tests/google-ui.cjs
          NODE_PATH=/tmp/login-browser-check/node_modules node tests/journal-ui.cjs
          NODE_PATH=/tmp/login-browser-check/node_modules node tests/account-ui.cjs
          NODE_PATH=/tmp/login-browser-check/node_modules node tests/login-ui.cjs
          NODE_PATH=/tmp/login-browser-check/node_modules node tests/recipe-board-ui.cjs
          NODE_PATH=/tmp/login-browser-check/node_modules node tests/private-board-ui.cjs
          NODE_PATH=/tmp/login-browser-check/node_modules node tests/board-ui.cjs

  production-account:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify deployed account pages and anonymous access restrictions
        run: |
          node --input-type=module <<'JS'
          const origin = 'https://dining.win';
          const pause = ms => new Promise(resolve => setTimeout(resolve, ms));
          let verified = false;
          for (let attempt = 0; attempt < 24; attempt++) {
            try {
              for (const [path, marker] of [['/forgot-password', 'id="forgot-password-form"'], ['/reset-password', 'id="reset-password-form"']]) {
                const response = await fetch(origin + path, { cache: 'no-store', signal: AbortSignal.timeout(15000) });
                if (!response.ok || !(await response.text()).includes(marker)) throw new Error('Page not deployed: ' + path);
              }
              for (const path of ['/guides', '/guides/menu-margin', '/guides/break-even', '/guides/solo-dining', '/guides/menu-complexity', '/editorial', '/privacy', '/terms']) {
                const result = await fetch(origin + path, { signal: AbortSignal.timeout(15000) });
                const html = await result.text();
                if (!result.ok || !html.includes('id="main-content"') || !html.includes('href="/privacy"')) throw new Error('Public journal page missing: ' + path);
                if (!path.startsWith('/guides/') && html.includes('adsbygoogle.js')) throw new Error('Ads present on non-content screen: ' + path);
              }
              const page = await fetch(origin + '/mypage', { redirect: 'manual', signal: AbortSignal.timeout(15000) });
              if (page.status !== 302 || !page.headers.get('location')?.includes('login_required=1')) throw new Error('Mypage access restriction failed');
              const account = await fetch(origin + '/api/account', { signal: AbortSignal.timeout(15000) });
              if (account.status !== 401) throw new Error('Anonymous account access was not rejected');
              for (const path of ['/api/forgot-password', '/api/reset-password']) {
                const response = await fetch(origin + path, { method: 'POST', headers: { Origin: origin, 'Content-Type': 'application/json' }, body: '{}', signal: AbortSignal.timeout(15000) });
                if (response.status !== 400) throw new Error('Invalid input was not rejected: ' + path);
              }
              console.log('Production account pages, login protection, and recovery validation verified. No email sent or account modified.');
              verified = true; break;
            } catch (error) {
              console.log('Awaiting production update:', error.message);
              await pause(10000);
            }
          }
          if (!verified) throw new Error('Production account verification did not pass');
          JS
