name: Check member authentication
on:
  push:
    branches: [main]
    paths:
      - 'functions/api/*.js'
      - 'src/member-auth.js'
      - 'src/community.js'
      - 'tests/community.test.js'
      - 'tests/board-ui.cjs'
      - 'assets/js/board.js'
      - 'assets/css/board.css'
      - 'src/social-auth.js'
      - 'tests/social-auth.test.js'
      - 'tests/kakao-auth.test.js'
      - 'tests/login-ui.cjs'
      - 'assets/js/visitors.js'
      - 'tests/visitors.test.js'
      - 'assets/js/login.js'
      - 'assets/js/site-menu.js'
      - 'assets/js/recipes.js'
      - 'assets/css/recipe-board.css'
      - 'tests/recipe-board-ui.cjs'
      - 'tests/recipe-access.test.js'
      - 'src/recipe-server.js'
      - 'src/private-server.js'
      - 'assets/js/private.js'
      - 'tests/private.test.js'
      - 'tests/private-board-ui.cjs'
      - 'assets/js/trend-video.js'
      - 'assets/js/trend-news.js'
      - 'tests/visit-news.test.js'
      - 'src/news-snapshot.js'
      - 'assets/css/page-layout.css'
      - 'tests/trend-video.test.js'
      - 'assets/css/signup.css'
      - '*.html'
      - 'tests/signup.test.js'
      - '.github/workflows/check-member-auth.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/private.test.js tests/community.test.js tests/visit-news.test.js tests/recipe-access.test.js tests/signup.test.js tests/social-auth.test.js tests/kakao-auth.test.js tests/trend-video.test.js tests/visitors.test.js

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser test tools
        run: |
          npm install --prefix /tmp/login-browser-check --no-save playwright
          /tmp/login-browser-check/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify login layout and account controls in Chromium
        run: |
          NODE_PATH=/tmp/login-browser-check/node_modules node tests/login-ui.cjs
          NODE_PATH=/tmp/login-browser-check/node_modules node tests/recipe-board-ui.cjs
          NODE_PATH=/tmp/login-browser-check/node_modules node tests/private-board-ui.cjs
          NODE_PATH=/tmp/login-browser-check/node_modules node tests/board-ui.cjs
