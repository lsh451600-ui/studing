name: Verify recipe membership deployment
on:
  push:
    branches: [main]
    paths:
      - functions/api/recipe*.js
      - functions/api/private*.js
      - src/private-server.js
      - src/recipe-server.js
      - src/member-levels.js
      - tests/member-levels.test.js
      - tests/recipes.test.js
      - .github/workflows/check-recipe-access.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recipe-deployment-check
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test owner permissions and persistent recipe storage
        run: node --test tests/recipes.test.js tests/private.test.js tests/member-levels.test.js
      - name: Verify deployed anonymous recipe restrictions
        run: |
          node --input-type=module <<'JS'
          const origin = 'https://dining.win';
          let verified = false;
          for (let attempt = 0; attempt < 24; attempt++) {
            try {
              for (const path of ['/api/recipes', '/api/recipe-posts', '/api/recipe-image?id=1', '/api/recipe-file?id=1', '/api/recipe-comments?postId=1', '/api/private', '/api/private-posts', '/api/private-image?id=1', '/api/private-file?id=1', '/api/private-comments?postId=1']) {
                const response = await fetch(origin + path, { cache: 'no-store', signal: AbortSignal.timeout(15000) });
                if (![401, 403].includes(response.status)) throw new Error('Anonymous access was not blocked: ' + path);
              }
              verified = true; break;
            } catch (error) { console.log('Awaiting membership deployment:', error.message); await new Promise(resolve => setTimeout(resolve, 5000)); }
          }
          if (!verified) throw new Error('Production recipe membership protection was not verified.');
          console.log('Anonymous recipe content, images, downloads and comments are blocked.');
          JS
